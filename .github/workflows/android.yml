name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # inahitajika kuweka APK kwenye Releases (tag v*)

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ukipakia madrasa-malela.zip (badala ya folda zote) kwenye repo, hapa inatolewa kiotomatiki
      - name: Unpack project zip (if needed)
        run: |
          if [ ! -f package.json ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -n 1)
            if [ -z "$ZIP" ]; then echo "::error::Hakuna package.json wala faili ya .zip kwenye repo. Pakia madrasa-malela.zip au faili zote za mradi."; exit 1; fi
            unzip -q "$ZIP" -d _unz
            cp -a _unz/*/. .
            rm -rf _unz
          fi
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app (Vite)
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Apply app icon (logo ya Madrasa Malela)
        run: |
          if [ -d resources/android/res ]; then
            cp -rf resources/android/res/. android/app/src/main/res/
            echo "App icon imewekwa."
          fi

      - name: Allow notifications (Android 13+)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "POST_NOTIFICATIONS" "$MANIFEST" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MANIFEST"

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MadrasaMalela.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MadrasaMalela-apk
          path: MadrasaMalela.apk

      - name: Publish to Releases (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MadrasaMalela.apk
